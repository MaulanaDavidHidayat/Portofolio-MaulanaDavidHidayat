<!doctype html>
<html lang="id">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <!-- preload Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />

    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <!-- SEO Utama -->
    <title>Maulana David Hidayat | Portofolio</title>
    <meta
      name="description"
      content="Website resmi Maulana David Hidayat, Student Developer. Saya berfokus pada penciptaan pengalaman digital yang menarik dan selalu berupaya memberikan solusi terbaik dalam setiap proyek yang saya kerjakan."
    />
    <meta
      name="keywords"
      content="Maulana David Hidayat, Maulana DH, Student Developer, maulanadh, Portofolio Maulana"
    />
    <meta name="author" content="Maulana David Hidayat" />

    <!-- Google Search Console -->

    <!-- Theme / PWA -->
    <meta name="theme-color" content="#030014" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://maulanadh.com/" />
    <meta
      property="og:title"
      content="Maulana David Hidayat | Student Developer"
    />
    <meta
      property="og:description"
      content="Website resmi dan portofolio Maulana David Hidayat, Student Developer."
    />
    <meta property="og:image" content="https://maulanadh.com/Meta.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://maulanadh.com/" />
    <meta
      name="twitter:title"
      content="Maulana David Hidayat | Student Developer"
    />
    <meta
      name="twitter:description"
      content="Website resmi dan portofolio Maulana David Hidayat."
    />
    <meta name="twitter:image" content="https://maulanadh.com/Meta.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://maulanadh.com/" />

    <!-- Structured Data: Person -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Maulana David Hidayat",
        "url": "https://mauviidev.site.je",
        "image": "https://mauviidev.site.je/Foto.png",
        "jobTitle": "Student Developer",
        "description": "Saya berfokus pada penciptaan pengalaman digital yang menarik dan selalu berupaya memberikan solusi terbaik dalam setiap proyek yang saya kerjakan.",
        "sameAs": [
          "https://www.linkedin.com/in/maulana-david-hidayat/",
          "https://www.instagram.com/ln.mauvii/",
          "https://github.com/MaulanaDavidHidayat",
          "https://www.tiktok.com/@maauvii"
        ]
      }
    </script>
  </head>

  <body>
    <!-- Konten teks penting untuk SEO -->
    <header style="display: none">
      <h1>Maulana David Hidayat</h1>
      <p>
        Saya berfokus pada penciptaan pengalaman digital yang menarik dan selalu
        berupaya memberikan solusi terbaik dalam setiap proyek yang saya
        kerjakan.
      </p>
    </header>

    <!-- Root React -->
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
